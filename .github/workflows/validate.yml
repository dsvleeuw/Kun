name: Validate Configs

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run StatusLine Test
        run: node tests/test-statusline.mjs

      - name: Validate Configurations
        run: node tests/validate-configs.mjs
