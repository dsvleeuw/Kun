# Starship configuration matching Kun Chen's setup
add_newline = false
format = "$directory$git_branch$git_status$cmd_duration$line_break$character"

[character]
success_symbol = "[❯](purple)"
error_symbol = "[❯](red)"

[cmd_duration]
format = "[$duration]($style) "

[directory]
truncation_length = 3
truncate_to_repo = true
style = "cyan bold"

[git_branch]
style = "purple bold"

[git_status]
style = "red bold"
